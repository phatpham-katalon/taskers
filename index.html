<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05304a">
    <meta name="Description" content="A dynamic and aesthetic To-Do List WebApp.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">

    <!-- font awesome (https://fontawesome.com) for basic icons; source: https://cdnjs.com/libraries/font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css" integrity="sha256-46r060N2LrChLLb5zowXQ72/iKKNiw/lAmygmHExk/o=" crossorigin="anonymous">

    <link rel="shortcut icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/css/main.css">
    <link rel="stylesheet" href="styles/css/corner.css">
    <title>JUST DO IT</title>
</head>
<body class="standard">
    <main class="app-shell">
        <header id="header" class="panel">
            <div class="header-top">
                <div class="brand-copy">
                    <p class="eyebrow">Daily Focus Planner</p>
                    <h1 id="title"><span>Just do it.</span></h1>
                    <p class="subtitle">Capture tasks quickly, then clear them one by one.</p>
                </div>
                <div class="flexrow-container" role="group" aria-label="Theme selector">
                    <button class="standard-theme theme-selector" type="button" aria-label="Standard theme"></button>
                    <button class="light-theme theme-selector" type="button" aria-label="Light theme"></button>
                    <button class="darker-theme theme-selector" type="button" aria-label="Darker theme"></button>
                </div>
            </div>
            <p class="datetime-chip">Local time: <span id="datetime"></span></p>
        </header>

        <section id="form" class="panel" aria-label="Create a todo">
            <form>
                <label class="sr-only" for="todo-input-field">Add a task</label>
                <input id="todo-input-field" class="todo-input" type="text" placeholder="Add a task...">
                <button class="todo-btn" type="submit">I got this</button>
            </form>
        </section>

        <section id="myUnOrdList" class="panel" aria-label="Todo list">
            <ul class="todo-list"></ul>
        </section>
    </main>

    <a href="https://github.com/tusharnankani/ToDoList" class="github-corner version" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" class="octo-body"></path>
        </svg>
    </a>

    <script src="time.js"></script>
    <script src="main.js" type="text/javascript"></script>
</body>
</html>
